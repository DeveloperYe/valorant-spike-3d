name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept SDK licenses
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "platform-tools" | tail -n 3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.gradle/native
            ~/.gradle/configuration-cache
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle', 'android/**/*.gradle.kts', 'android/gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Fetch Gradle distribution
        working-directory: android
        run: |
          set -euo pipefail
          GRADLE_VERSION=8.7
          if [ ! -x gradle-dist/gradle-$GRADLE_VERSION/bin/gradle ]; then
            echo "Downloading Gradle $GRADLE_VERSION..."
            curl -sSL -o gradle.zip "https://services.gradle.org/distributions/gradle-$GRADLE_VERSION-bin.zip"
            mkdir -p gradle-dist
            unzip -q -o gradle.zip -d gradle-dist
            rm -f gradle.zip
          fi
          gradle-dist/gradle-$GRADLE_VERSION/bin/gradle --version | grep -E '^Gradle'

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradle-dist/gradle-8.7/bin/gradle
          ./gradle-dist/gradle-8.7/bin/gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Build Release APK (unsigned)
        working-directory: android
        run: |
          ./gradle-dist/gradle-8.7/bin/gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Locate APKs
        id: apks
        run: |
          set -euo pipefail
          DEBUG=$(find android/app/build/outputs/apk -name '*.apk' | sort | tr '\n' ' ')
          echo "Found APKs: $DEBUG"
          mkdir -p dist
          find android/app/build/outputs/apk -name '*.apk' -exec cp {} dist/ \;
          ls -lh dist/

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: spike-3d-apks
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Spike 3D v${{ github.run_number }}
          body: |
            无畏契约爆能器 3D 模型 Android 版本（WebView 壳，全离线运行）。

            - `app-debug.apk` — 调试版
            - `app-release-unsigned.apk` — 发布版（未签名，需自行签名后安装）
          files: dist/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
